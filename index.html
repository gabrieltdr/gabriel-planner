          '<div class="rowactions"><button class="btn ghost" data-edit-meta="'+m.id+'">Editar</button><button class="btn ghost danger" data-del-meta="'+m.id+'">Excluir</button></div>' +
        '</div>' +
        '<div class="progress-track"><div class="progress-fill" style="width:'+pct.toFixed(1)+'%"></div></div>' +
        '<div class="sub" style="margin-top:6px;">'+fmtBRL(m.valorAtual)+' de '+fmtBRL(m.valorAlvo)+' ('+pct.toFixed(1)+'%) · Prazo: '+fmtDate(m.prazo)+' · '+esc(m.categoria||"—")+'</div>' +
      '</div>';
    }).join("");
    wrap.querySelectorAll("[data-edit-meta]").forEach(function(b){
      b.addEventListener("click", function(){ state.editing.meta = b.getAttribute("data-edit-meta"); renderMetas(); });
    });
    wrap.querySelectorAll("[data-del-meta]").forEach(function(b){
      b.addEventListener("click", async function(){ if(!state.db) return; await state.db.doc("metas/"+b.getAttribute("data-del-meta")).delete(); });
    });
  }

  // ---------------- investimentos ----------------
  function renderInvestimentos(){
    var el = document.getElementById("tab-investimentos");
    var editing = state.editing.investimento;
    var i = editing ? state.investimentos.find(function(x){return x.id===editing;}) : null;
    el.innerHTML =
      '<div class="pagehead"><h1>Investimentos</h1><p>Módulo em construção — comece a registrar seus ativos conforme for evoluindo a carteira.</p></div>' +
      '<div class="panel"><div class="panel-head"><h2>'+(i?"Editar ativo":"Novo ativo")+'</h2></div>' +
      '<div class="panel-body"><form id="form-invest" class="form-grid">' +
        field("Ativo","ativo","text", i?i.ativo:"", "Ex: Tesouro Selic 2029") +
        field("Tipo","tipo","text", i?i.tipo:"", "Ex: Renda Fixa, Ação, ETF") +
        field("Valor Investido","valorInvestido","number", i?i.valorInvestido:"", "0,00","0.01") +
        field("Valor Atual","valorAtual","number", i?i.valorAtual:"", "0,00","0.01") +
      '</form>' +
      '<div class="form-actions">' + (i?'<button class="btn secondary" id="cancel-invest" type="button">Cancelar</button>':'') + '<button class="btn" type="submit" form="form-invest" id="save-invest">'+(i?"Salvar":"Adicionar")+'</button></div>' +
      '</div></div>' +
      '<div class="panel"><div class="panel-head"><h2>Carteira</h2></div><div class="panel-body"><div class="tablewrap" id="invest-table"></div></div></div>';

    document.getElementById("form-invest").addEventListener("submit", async function(ev){
      ev.preventDefault();
      var fd = new FormData(ev.target);
      var data = {
        ativo: fd.get("ativo")||"",
        tipo: fd.get("tipo")||"",
        valorInvestido: parseFloat(fd.get("valorInvestido"))||0,
        valorAtual: parseFloat(fd.get("valorAtual"))||0
      };
      if(!state.db) return;
      var btn = document.getElementById("save-invest"); btn.disabled=true;
      try{
        if(editing){ await state.db.doc("investimentos/"+editing).set(data); state.editing.investimento=null; }
        else { await state.db.collection("investimentos").add(data); }
        renderInvestimentos();
      } finally { btn.disabled=false; }
    });
    if(i){
      document.getElementById("cancel-invest").addEventListener("click", function(){ state.editing.investimento=null; renderInvestimentos(); });
    }
    renderInvestTable();
  }

  function renderInvestTable(){
    var wrap = document.getElementById("invest-table");
    if(!wrap) return;
    if(!state.investimentos.length){ wrap.innerHTML = '<div class="empty">Nenhum ativo cadastrado ainda.</div>'; return; }
    var rows = state.investimentos.map(function(i){
      var rent = Number(i.valorInvestido)>0 ? (Number(i.valorAtual)-Number(i.valorInvestido))/Number(i.valorInvestido)*100 : 0;
      return '<tr>' +
        '<td>'+esc(i.ativo)+'</td>' +
        '<td>'+esc(i.tipo)+'</td>' +
        '<td class="num">'+fmtBRL(i.valorInvestido)+'</td>' +
        '<td class="num">'+fmtBRL(i.valorAtual)+'</td>' +
        '<td class="num" style="color:var(--'+(rent>=0?"positive":"negative")+');">'+rent.toFixed(1)+'%</td>' +
        '<td class="rowactions"><button class="btn ghost" data-edit-invest="'+i.id+'">Editar</button><button class="btn ghost danger" data-del-invest="'+i.id+'">Excluir</button></td>' +
      '</tr>';
    }).join("");
    wrap.innerHTML = '<table><thead><tr><th>Ativo</th><th>Tipo</th><th>Valor Investido</th><th>Valor Atual</th><th>Rentabilidade</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>';
    wrap.querySelectorAll("[data-edit-invest]").forEach(function(b){
      b.addEventListener("click", function(){ state.editing.investimento = b.getAttribute("data-edit-invest"); renderInvestimentos(); });
    });
    wrap.querySelectorAll("[data-del-invest]").forEach(function(b){
      b.addEventListener("click", async function(){ if(!state.db) return; await state.db.doc("investimentos/"+b.getAttribute("data-del-invest")).delete(); });
    });
  }

  // ---------------- forex ----------------
  function renderForex(){
    var el = document.getElementById("tab-forex");
    el.innerHTML =
      '<div class="pagehead"><h1>Forex</h1><p>Operações, propfirms e relatórios de performance.</p></div>' +
      '<div class="subtabs">' +
        '<button class="subtab'+(state.forexSubtab==="operacoes"?" active":"")+'" data-subtab="operacoes">Operações</button>' +
        '<button class="subtab'+(state.forexSubtab==="propfirms"?" active":"")+'" data-subtab="propfirms">Propfirms</button>' +
        '<button class="subtab'+(state.forexSubtab==="relatorios"?" active":"")+'" data-subtab="relatorios">Relatórios</button>' +
      '</div>' +
      '<div id="forex-content"></div>';
    el.querySelectorAll(".subtab").forEach(function(b){
      b.addEventListener("click", function(){ state.forexSubtab = b.getAttribute("data-subtab"); renderForex(); });
    });
    if(state.forexSubtab==="propfirms") renderPropfirms();
    else if(state.forexSubtab==="relatorios") renderRelatoriosForex();
    else renderOperacoes();
  }

  function propfirmSelectHtml(selectedId){
    var opts = state.propfirms.map(function(p){
      return '<option value="'+esc(p.id)+'"'+(p.id===selectedId?" selected":"")+'>'+esc(p.nome)+'</option>';
    }).join("");
    return '<div class="field"><label for="f-propfirmId">Propfirm</label><select name="propfirmId" id="f-propfirmId"><option value="">Selecione</option>'+opts+'</select></div>';
  }

  function renderOperacoes(){
    var content = document.getElementById("forex-content");
    var editing = state.editing.operacao;
    var o = editing ? state.operacoesForex.find(function(x){return x.id===editing;}) : null;
    var temPropfirms = state.propfirms.length>0;
    var filtro = state.opFiltroPropfirm || "";
    var lista = filtro ? state.operacoesForex.filter(function(x){return x.propfirmId===filtro;}) : state.operacoesForex;
    var total = lista.reduce(function(s,x){return s+(Number(x.resultado)||0);},0);
    var tipoDefault = o ? (o.resultadoTipo || (Number(o.resultado)>=0 ? "Vitória" : "Derrota")) : "Vitória";
    var valorDefault = o ? Math.abs(Number(o.resultado)||0) : "";

    var formHtml = !temPropfirms
      ? '<div class="panel"><div class="empty">Cadastre uma propfirm na aba "Propfirms" antes de lançar operações.</div></div>'
      : ('<div class="panel"><div class="panel-head"><h2>'+(o?"Editar operação":"Nova operação")+'</h2></div>' +
        '<div class="panel-body"><form id="form-op" class="form-grid">' +
          propfirmSelectHtml(o?o.propfirmId:"") +
          field("Data","data","date", o?o.data:"") +
          field("Ativo/Par","ativo","text", o?o.ativo:"", "Ex: EURUSD") +
          selectField("Direção","direcao",["Compra","Venda"], o?o.direcao:"Compra") +
          field("Valor de Entrada","valorEntrada","number", o?o.valorEntrada:"", "0.00000","0.00001") +
          field("Stop Loss","stopLoss","number", o?o.stopLoss:"", "0.00000","0.00001") +
          field("Take Profit","takeProfit","number", o?o.takeProfit:"", "0.00000","0.00001") +
          selectField("Resultado","resultadoTipo",["Vitória","Derrota"], tipoDefault) +
          field("Valor do Resultado ($)","resultadoValor","number", valorDefault, "0.00","0.01") +
          field("Análise","analise","text", o?o.analise:"", "Motivo da entrada", null, true) +
        '</form>' +
        '<div class="form-actions">' + (o?'<button class="btn secondary" id="cancel-op" type="button">Cancelar</button>':'') + '<button class="btn" type="submit" form="form-op" id="save-op">'+(o?"Salvar":"Adicionar")+'</button></div>' +
        '</div></div>');

    content.innerHTML =
      formHtml +
      '<div class="panel"><div class="panel-head"><h2>Operações</h2>' +
        '<div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">' +
          '<select id="op-filtro-propfirm">' +
            '<option value="">Todas as propfirms</option>' +
            state.propfirms.map(function(p){return '<option value="'+esc(p.id)+'"'+(p.id===filtro?" selected":"")+'>'+esc(p.nome)+'</option>';}).join("") +
          '</select>' +
          '<div class="sub num" style="color:'+(total>=0?"var(--positive)":"var(--negative)")+';">Resultado: '+fmtUSD(total)+' · '+lista.length+' operações</div>' +
        '</div>' +
      '</div>' +
      '<div class="panel-body"><div class="tablewrap" id="op-table"></div></div></div>';

    var filtroSel = document.getElementById("op-filtro-propfirm");
    filtroSel.addEventListener("change", function(ev){ state.opFiltroPropfirm = ev.target.value; renderOperacoes(); });

    if(temPropfirms){
      document.getElementById("form-op").addEventListener("submit", async function(ev){
        ev.preventDefault();
        var fd = new FormData(ev.target);
        var pfId = fd.get("propfirmId")||"";
        var pfObj = state.propfirms.find(function(p){return p.id===pfId;});
        if(!pfId || !pfObj){ window.alert("Selecione uma propfirm."); return; }
        var tipo = fd.get("resultadoTipo") || "Vitória";
        var valorResultado = Math.abs(parseFloat(fd.get("resultadoValor"))||0);
        var data = {
          propfirmId: pfId,
          propfirmNome: pfObj.nome,
          data: fd.get("data")||"",
          ativo: fd.get("ativo")||"",
          direcao: fd.get("direcao"),
          valorEntrada: parseFloat(fd.get("valorEntrada"))||0,
          stopLoss: parseFloat(fd.get("stopLoss"))||0,
          takeProfit: parseFloat(fd.get("takeProfit"))||0,
          resultadoTipo: tipo,
          resultado: tipo==="Vitória" ? valorResultado : -valorResultado,
          analise: fd.get("analise")||""
        };
        if(!state.db) return;
        var btn = document.getElementById("save-op"); btn.disabled=true;
        try{
          var col = state.db.collection("operacoesForex");
          if(editing){ await col.doc(editing).set(data); state.editing.operacao=null; }
          else { await col.add(data); }
          renderOperacoes();
        } finally { btn.disabled=false; }
      });
      if(o){
        document.getElementById("cancel-op").addEventListener("click", function(){ state.editing.operacao=null; renderOperacoes(); });
      }
    }
    renderOpTable(lista);
  }

  function renderOpTable(lista){
    var wrap = document.getElementById("op-table");
    if(!wrap) return;
    if(!lista.length){ wrap.innerHTML = '<div class="empty">Nenhuma operação registrada ainda.</div>'; return; }
    var rows = lista.map(function(o){
      var res = Number(o.resultado)||0;
      var win = o.resultadoTipo ? o.resultadoTipo==="Vitória" : res>=0;
      return '<tr>' +
        '<td>'+fmtDate(o.data)+'</td>' +
        '<td>'+esc(o.propfirmNome||"—")+'</td>' +
        '<td>'+esc(o.ativo)+'</td>' +
        '<td>'+esc(o.direcao)+'</td>' +
        '<td class="num">'+Number(o.valorEntrada).toFixed(5)+'</td>' +
        '<td class="num">'+Number(o.stopLoss).toFixed(5)+'</td>' +
        '<td class="num">'+Number(o.takeProfit).toFixed(5)+'</td>' +
        '<td><span class="pill '+(win?"receita":"despesa")+'">'+(win?"Vitória":"Derrota")+'</span> <span class="num">'+fmtUSD(Math.abs(res))+'</span></td>' +
        '<td style="max-width:200px;">'+esc(o.analise)+'</td>' +
        '<td class="rowactions"><button class="btn ghost" data-edit-op="'+o.id+'">Editar</button><button class="btn ghost danger" data-del-op="'+o.id+'">Excluir</button></td>' +
      '</tr>';
    }).join("");
    wrap.innerHTML = '<table><thead><tr><th>Data</th><th>Propfirm</th><th>Ativo</th><th>Direção</th><th>Entrada</th><th>SL</th><th>TP</th><th>Resultado</th><th>Análise</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>';
    wrap.querySelectorAll("[data-edit-op]").forEach(function(b){
      b.addEventListener("click", function(){ state.editing.operacao = b.getAttribute("data-edit-op"); renderOperacoes(); });
    });
    wrap.querySelectorAll("[data-del-op]").forEach(function(b){
      b.addEventListener("click", async function(){ if(!state.db) return; await state.db.doc("operacoesForex/"+b.getAttribute("data-del-op")).delete(); });
    });
  }

  function renderPropfirms(){
    var content = document.getElementById("forex-content");
    var editing = state.editing.propfirm;
    var pf = editing ? state.propfirms.find(function(p){return p.id===editing;}) : null;
    content.innerHTML =
      '<div class="panel"><div class="panel-head"><h2>'+(pf?"Editar propfirm":"Nova propfirm")+'</h2></div>' +
      '<div class="panel-body"><form id="form-propfirm" class="form-grid">' +
        field("Nome","nome","text", pf?pf.nome:"", "Ex: FTMO, The5ers 2.5k") +
        field("Capital Inicial","capital","number", pf?pf.capital:"", "0.00","0.01") +
      '</form>' +
      '<div class="form-actions">' + (pf?'<button class="btn secondary" id="cancel-propfirm" type="button">Cancelar</button>':'') + '<button class="btn" type="submit" form="form-propfirm" id="save-propfirm">'+(pf?"Salvar":"Adicionar")+'</button></div>' +
      '</div></div>' +
      '<div class="panel"><div class="panel-head"><h2>Suas propfirms</h2></div><div class="panel-body"><div class="tablewrap" id="propfirms-table"></div></div></div>';

    document.getElementById("form-propfirm").addEventListener("submit", async function(ev){
      ev.preventDefault();
      var fd = new FormData(ev.target);
      var nome = (fd.get("nome")||"").trim();
      var capital = parseFloat(fd.get("capital"))||0;
      if(!nome || !state.db) return;
      var btn = document.getElementById("save-propfirm"); btn.disabled=true;
      try{
        if(editing){
          await state.db.doc("propfirms/"+editing).update({ nome: nome, capital: capital });
          state.editing.propfirm = null;
        } else {
          var id = slugify(nome);
          var existing = await state.db.doc("propfirms/"+id).get();
          if(existing.exists){ window.alert("Já existe uma propfirm com esse nome."); return; }
          await state.db.doc("propfirms/"+id).set({ nome: nome, capital: capital });
        }
        renderPropfirms();
      } finally { btn.disabled=false; }
    });
    if(pf){
      document.getElementById("cancel-propfirm").addEventListener("click", function(){ state.editing.propfirm=null; renderPropfirms(); });
    }
    renderPropfirmsTable();
  }

  function renderPropfirmsTable(){
    var wrap = document.getElementById("propfirms-table");
    if(!wrap) return;
    if(!state.propfirms.length){ wrap.innerHTML = '<div class="empty">Nenhuma propfirm cadastrada ainda.</div>'; return; }
    var rows = state.propfirms.map(function(p){
      var ops = state.operacoesForex.filter(function(o){return o.propfirmId===p.id;});
      var resultado = ops.reduce(function(s,o){return s+(Number(o.resultado)||0);},0);
      var capital = Number(p.capital)||0;
      var saldo = capital + resultado;
      return '<tr>' +
        '<td>'+esc(p.nome)+'</td>' +
        '<td class="num">'+fmtUSD(capital)+'</td>' +
        '<td class="num" style="color:'+(resultado>=0?"var(--positive)":"var(--negative)")+';">'+fmtUSD(resultado)+'</td>' +
        '<td class="num">'+fmtUSD(saldo)+'</td>' +
        '<td class="num">'+ops.length+'</td>' +
        '<td class="rowactions"><button class="btn ghost" data-edit-pf="'+p.id+'">Editar</button><button class="btn ghost danger" data-del-pf="'+p.id+'">Excluir</button></td>' +
      '</tr>';
    }).join("");
    wrap.innerHTML = '<table><thead><tr><th>Nome</th><th>Capital Inicial</th><th>Resultado</th><th>Saldo Atual</th><th>Operações</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>';
    wrap.querySelectorAll("[data-edit-pf]").forEach(function(b){
      b.addEventListener("click", function(){ state.editing.propfirm=b.getAttribute("data-edit-pf"); renderPropfirms(); });
    });
    wrap.querySelectorAll("[data-del-pf]").forEach(function(b){
      b.addEventListener("click", async function(){
        var id = b.getAttribute("data-del-pf");
        if(!state.db) return;
        await state.db.doc("propfirms/"+id).delete();
      });
    });
  }

  function segBtn(val,label,current){
    return '<button type="button" class="btn'+(val===current?"":" secondary")+'" data-periodo="'+val+'" style="padding:7px 12px;">'+label+'</button>';
  }

  function renderRelatoriosForex(){
    var content = document.getElementById("forex-content");
    var rel = state.forexRelatorio;
    var range = periodoRange(rel.periodo, rel.ref);
    var lista = state.operacoesForex.filter(function(o){ return o.data >= range.start && o.data <= range.end; }).sort(function(a,b){ return a.data<b.data?-1:(a.data>b.data?1:0); });

    var vitorias = lista.filter(function(o){ return o.resultadoTipo ? o.resultadoTipo==="Vitória" : Number(o.resultado)>=0; }).length;
    var derrotas = lista.length - vitorias;
    var taxaAcerto = lista.length ? (vitorias/lista.length*100) : 0;
    var resultado = lista.reduce(function(s,o){return s+(Number(o.resultado)||0);},0);

    content.innerHTML =
      '<div class="panel"><div class="panel-body">' +
        '<div class="propfirm-bar">' +
          segBtn("semanal","Semanal",rel.periodo) + segBtn("quinzenal","Quinzenal",rel.periodo) + segBtn("mensal","Mensal",rel.periodo) +
          '<span style="flex:1"></span>' +
          '<button class="btn ghost" id="rel-prev" type="button" aria-label="Período anterior">←</button>' +
          '<strong style="min-width:180px;text-align:center;">'+periodoLabel(rel.periodo, range)+'</strong>' +
          '<button class="btn ghost" id="rel-next" type="button" aria-label="Próximo período">→</button>' +
        '</div>' +
        '<div class="cards" style="margin-bottom:0;">' +
          card("Vitórias", String(vitorias)) +
          card("Derrotas", String(derrotas)) +
          card("Taxa de Acerto", taxaAcerto.toFixed(1)+"%") +
          card("Resultado do Período", fmtUSD(resultado), resultado>=0?"positive":"negative") +
        '</div>' +
      '</div></div>' +
      '<div class="panel"><div class="panel-head"><h2>Vitórias x Derrotas</h2></div><div class="panel-body"><div id="chart-vd"></div></div></div>' +
      '<div class="panel"><div class="panel-head"><h2>Evolução no período</h2></div><div class="panel-body"><div id="chart-evolucao"></div></div></div>' +
      '<div class="panel"><div class="panel-head"><h2>Crescimento por Propfirm</h2></div><div class="panel-body"><div id="chart-propfirm"></div></div></div>';

    content.querySelectorAll("[data-periodo]").forEach(function(b){
      b.addEventListener("click", function(){
        state.forexRelatorio.periodo = b.getAttribute("data-periodo");
        state.forexRelatorio.ref = toISODate(new Date());
        renderRelatoriosForex();
      });
    });
    document.getElementById("rel-prev").addEventListener("click", function(){ state.forexRelatorio.ref = periodoNav(rel.periodo, range.start, -1); renderRelatoriosForex(); });
    document.getElementById("rel-next").addEventListener("click", function(){ state.forexRelatorio.ref = periodoNav(rel.periodo, range.start, 1); renderRelatoriosForex(); });

    if(lista.length){
      renderBarChart("chart-vd", [""], [
        { label:"Vitórias", color:"var(--positive)", values:[vitorias] },
        { label:"Derrotas", color:"var(--negative)", values:[derrotas] }
      ], { height:180, yFormat:function(v){return v.toFixed(0);} });

      var running=0;
      var pts = lista.map(function(o){ running += (Number(o.resultado)||0); return {t: toTs(o.data), y: running}; });
      renderLineChart("chart-evolucao", [{label:"Resultado acumulado", color:"var(--accent)", points: pts}], { height:200, yFormat: fmtUSD });
    } else {
      document.getElementById("chart-vd").innerHTML = '<div class="empty">Nenhuma operação nesse período.</div>';
      document.getElementById("chart-evolucao").innerHTML = '<div class="empty">Nenhuma operação nesse período.</div>';
    }

    renderCrescimentoPropfirmChart();
  }

  function renderCrescimentoPropfirmChart(){
    var el = document.getElementById("chart-propfirm");
    if(!el) return;
    var series = [];
    state.propfirms.forEach(function(pf, i){
      var ops = state.operacoesForex.filter(function(o){return o.propfirmId===pf.id;}).sort(function(a,b){return a.data<b.data?-1:(a.data>b.data?1:0);});
      if(!ops.length) return;
      var running = Number(pf.capital)||0;
      var pts = ops.map(function(o){ running += (Number(o.resultado)||0); return {t: toTs(o.data), y: running}; });
      series.push({ label: pf.nome, color: seriesColor(i), points: pts });
    });
    if(!series.length){ el.innerHTML = '<div class="empty">Nenhuma propfirm com operações registradas ainda.</div>'; return; }
    renderLineChart("chart-propfirm", series, { height:240, yFormat: fmtUSD });
  }

  // ---------------- form helpers ----------------
  function field(label, name, type, value, placeholder, step, wide){
    value = value==null ? "" : value;
    var attrs = 'name="'+name+'" id="f-'+name+'"';
    if(type==="number") attrs += ' step="'+(step||"any")+'"';
    if(placeholder) attrs += ' placeholder="'+esc(placeholder)+'"';
    var input = wide
      ? '<textarea '+attrs+'>'+esc(value)+'</textarea>'
      : '<input type="'+type+'" '+attrs+' value="'+esc(value)+'">';
    return '<div class="field'+(wide?" wide":"")+'"><label for="f-'+name+'">'+esc(label)+'</label>'+input+'</div>';
  }
  function selectField(label, name, options, selected){
    return '<div class="field"><label for="f-'+name+'">'+esc(label)+'</label><select name="'+name+'" id="f-'+name+'"><option value=""></option>'+optionsHtml(options, selected)+'</select></div>';
  }

  if("serviceWorker" in navigator){ window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
  init();
})();
</script>
</body>
</html>
