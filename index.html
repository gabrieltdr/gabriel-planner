<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090B0A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Gabriel Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
  /* ===== Gabriel Planner — tema escuro verde e dourado (visual da Blendêê) ===== */
  :root{
    color-scheme:dark;
    --bg:#090B0A; --bg-2:#0D100E;
    --surface:#111412; --surface-2:#181C19; --surface-3:#1F2420;
    --glass:rgba(255,255,255,0.028); --glass-hi:rgba(255,255,255,0.05);
    --text:#ECEAE3; --text-muted:#8C928D; --text-faint:#5F6661;
    --cream:#ECE8DE; --cream-ink:#0A0C0B;
    --gold:#C9A96E; --gold-soft:rgba(201,169,110,0.14);
    --brand:#14302A; --brand-2:#1E4D3F; --brand-3:#2A6652;
    --accent:#86C29C; --accent-soft:rgba(134,194,156,0.10);
    --positive:#86C29C;
    --negative:#E8806F; --negative-soft:rgba(232,128,111,0.10);
    --caution:#DDB866; --info:#9DBBDB; --violet:#B79CE0;
    --border:rgba(255,255,255,0.075); --border-strong:rgba(255,255,255,0.14);
    --series-1:#9DBBDB; --series-2:#E8806F; --series-3:#86C29C; --series-4:#DDB866;
    --radius:16px;
    --shadow:0 1px 0 rgba(255,255,255,0.04) inset, 0 20px 40px -24px rgba(0,0,0,0.8);
    --mono:'Geist Mono', ui-monospace, 'SFMono-Regular', monospace;
    --sans:'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  html{height:100%; background:var(--bg);}
  body{
    margin:0; min-height:100%; color:var(--text); font-family:var(--sans); font-size:14px; letter-spacing:-0.005em;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(1100px 600px at 78% -10%, rgba(201,169,110,0.07), transparent 60%),
      radial-gradient(900px 700px at 10% 110%, rgba(40,90,70,0.18), transparent 60%),
      var(--bg);
    background-attachment:fixed;
  }
  /* granulado sutil por cima de tudo */
  body::after{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:100; opacity:.06; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  h1,h2,h3{font-family:var(--sans); font-weight:500; letter-spacing:-0.02em; text-wrap:balance; margin:0;}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit; font-size:14px;}
  :focus-visible{outline:1.5px solid var(--gold); outline-offset:2px;}
  ::selection{background:var(--gold-soft); color:var(--text);}
  ::-webkit-scrollbar{width:10px; height:10px;} ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08); border-radius:99px; border:3px solid transparent; background-clip:padding-box;}
  ::-webkit-scrollbar-track{background:transparent;}
  svg.ic{display:block; flex-shrink:0;}

  .shell{display:flex; min-height:100vh;}

  /* ---------- sidebar ---------- */
  .sidebar{
    position:fixed; top:0; left:0; bottom:0; width:244px; z-index:25;
    background:linear-gradient(180deg, rgba(17,20,18,0.94), rgba(10,12,11,0.94)); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border-right:1px solid var(--border); padding:24px 14px 16px;
    display:flex; flex-direction:column; gap:18px; overflow-y:auto;
  }
  .logo{display:flex; align-items:center; gap:12px; padding:2px 6px 18px; border-bottom:1px solid var(--border);}
  .logo-mark{width:46px; height:46px; border-radius:13px; display:grid; place-items:center; flex-shrink:0; color:var(--gold);
    background:linear-gradient(160deg, var(--brand-2), #0F2A23); border:1px solid rgba(201,169,110,0.35);
    box-shadow:0 10px 30px -12px rgba(20,48,42,0.9), 0 0 0 1px rgba(255,255,255,0.04) inset;}
  .logo-txt{font-family:var(--mono); font-weight:600; font-size:13px; letter-spacing:.16em; line-height:1.3; color:var(--text);}
  .logo-txt span{display:block; color:var(--gold);}
  nav.navlist{display:flex; flex-direction:column; gap:4px;}
  .navitem{
    position:relative; display:flex; align-items:center; gap:14px;
    padding:12px 14px; border-radius:12px; border:1px solid transparent; background:transparent;
    color:var(--text-muted); text-decoration:none; cursor:pointer;
    font-size:14px; font-weight:400; text-align:left; width:100%; transition:background .15s, color .15s, border-color .15s;
  }
  .navitem svg{width:20px; height:20px; flex:0 0 20px; opacity:.8;}
  .navitem:hover{background:var(--glass-hi); color:var(--text);}
  .navitem.active{background:linear-gradient(180deg, var(--brand-3), var(--brand-2)); border-color:rgba(134,194,156,0.35); color:#fff; font-weight:500; box-shadow:0 10px 26px -14px rgba(42,102,82,0.95);}
  .navitem.active svg{opacity:1; color:var(--gold);}
  .lbl-s{display:none;}
  .side-user{margin-top:auto; display:flex; align-items:center; gap:10px; padding:14px 8px 0; border-top:1px solid var(--border); background:none; border-left:0; border-right:0; border-bottom:0; color:var(--text); font-size:13.5px; text-align:left; width:100%;}
  .side-user small{display:block; color:var(--text-faint); font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; margin-top:2px;}
  .avatar{width:34px; height:34px; border-radius:50%; display:grid; place-items:center; flex-shrink:0; font-size:14px; font-weight:500; color:var(--gold);
    background:linear-gradient(160deg, var(--brand-3), var(--brand)); border:1.5px solid rgba(201,169,110,0.45);}
  button.avatar{padding:0; cursor:pointer;}
  .avatar.big{width:40px; height:40px; box-shadow:0 0 0 4px rgba(201,169,110,0.08);}

  /* ---------- conteúdo ---------- */
  .main{position:relative; flex:1; min-width:0; margin-left:244px; padding:0 36px 130px;}
  .main > section{max-width:1100px; animation:fadeUp .28s ease both;}
  .main > section[hidden]{animation:none;}
  @keyframes fadeUp{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  .appbar{position:absolute; top:26px; right:36px; display:flex; align-items:center; gap:10px; z-index:6;}
  .appbar-right{display:flex; align-items:center; gap:10px;}
  .m-logo{display:none;}
  .bell{position:relative; width:40px; height:40px; border-radius:50%; border:none; background:transparent; color:var(--text); display:grid; place-items:center; transition:background .15s;}
  .bell:hover{background:var(--glass-hi);}
  .bell .badge{position:absolute; top:8px; right:9px; width:8px; height:8px; border-radius:50%; background:var(--gold); box-shadow:0 0 8px var(--gold);}
  .hello, .pagehead{padding:30px 130px 22px 0; margin:0;}
  .hello h1, .pagehead h1{font-size:36px; font-weight:500; letter-spacing:-0.03em; line-height:1.1; margin:0;}
  .hello p, .pagehead p{margin:8px 0 0; color:var(--text-muted); font-size:16px;}
  #fin-subnav ~ section .pagehead{padding-top:18px;}
  .seg{display:inline-flex; gap:4px; padding:4px; margin-top:28px; max-width:100%; overflow-x:auto; border:1px solid var(--border); border-radius:12px; background:rgba(255,255,255,0.025);}
  .seg button{padding:8px 14px; border-radius:9px; border:none; background:transparent; color:var(--text-muted); font-family:var(--mono); font-size:11px; font-weight:500; letter-spacing:.1em; text-transform:uppercase; white-space:nowrap; transition:color .15s, background .15s;}
  .seg button:hover{color:var(--text);}
  .seg button.active{background:rgba(255,255,255,0.08); color:var(--text); box-shadow:0 0 0 1px var(--border) inset;}

  /* ---------- cards de indicador ---------- */
  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin-bottom:26px;}
  .card{
    --tone:var(--text-muted);
    position:relative; overflow:hidden; border-radius:var(--radius); padding:18px 20px 16px; min-height:112px;
    background:linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.015)); border:1px solid var(--border);
    box-shadow:var(--shadow); color:var(--text); container-type:inline-size;
  }
  .card:has(.value.positive){--tone:var(--positive);}
  .card:has(.value.negative){--tone:var(--negative);}
  .card::before{ content:""; position:absolute; top:0; left:20px; right:20px; height:1px; background:linear-gradient(90deg, transparent, var(--tone), transparent); opacity:.55; }
  .card::after{ content:""; position:absolute; right:-40px; top:-40px; width:140px; height:140px; border-radius:50%; background:radial-gradient(circle, var(--tone), transparent 70%); opacity:.07; pointer-events:none; }
  .card .label{display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-muted); font-weight:500; margin-bottom:8px;}
  .card .label::before{ content:""; width:6px; height:6px; border-radius:50%; background:var(--tone); box-shadow:0 0 8px var(--tone); flex-shrink:0; }
  .card .value{font-size:clamp(18px, 10.5cqi, 28px); white-space:nowrap; font-weight:300; letter-spacing:-0.035em; line-height:1.1; margin-top:10px; font-variant-numeric:tabular-nums;}
  .card .value.positive{color:var(--positive);}
  .card .value.negative{color:var(--negative);}
  .card .sub{font-size:12px; color:var(--text-muted); margin-top:6px;}

  /* ---------- painéis ---------- */
  .panel{background:linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.012)); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:20px; overflow:hidden;}
  .panel-head{padding:15px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .panel-head h2{font-family:var(--mono); font-size:10.5px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--text-muted); margin:0;}
  .panel-body{padding:18px 20px;}

  /* ---------- formulários ---------- */
  .form-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px;}
  .field{display:flex; flex-direction:column; gap:6px;}
  .field label{font-family:var(--mono); font-size:10px; font-weight:500; letter-spacing:.12em; text-transform:uppercase; color:var(--text-muted);}
  .field input, .field select, .field textarea{
    padding:10px 12px; border-radius:9px; border:1px solid var(--border);
    background:rgba(0,0,0,0.3); color:var(--text); outline:none; min-width:0; width:100%;
    transition:border-color .15s, box-shadow .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:rgba(201,169,110,0.5); box-shadow:0 0 0 3px rgba(201,169,110,0.12);}
  .field input::placeholder, .field textarea::placeholder{color:var(--text-faint);}
  select option{background:#151816; color:var(--text);}
  .panel-head select, .propfirm-bar select, .rowactions select{background:rgba(0,0,0,0.3); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:7px 9px; outline:none;}
  .field textarea{resize:vertical; min-height:56px;}
  .field.wide{grid-column:1/-1;}
  input[type="date"], input[type="month"]{color-scheme:dark;}

  /* ---------- botões ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    padding:9px 14px; border-radius:8px; border:1px solid transparent;
    background:var(--cream); color:var(--cream-ink);
    font-family:var(--mono); font-size:11.5px; font-weight:500; text-transform:uppercase; letter-spacing:.08em; white-space:nowrap;
    box-shadow:0 0 0 1px rgba(255,255,255,0.4) inset, 0 8px 24px -10px rgba(236,232,222,0.35);
    transition:background .15s, border-color .15s, box-shadow .15s, transform .05s;
  }
  .btn:hover{background:#FFFFFF; box-shadow:0 0 0 1px #fff inset, 0 10px 28px -8px rgba(236,232,222,0.5);}
  .btn:active{transform:translateY(1px);}
  .btn.secondary{background:rgba(255,255,255,0.02); border-color:var(--border-strong); color:var(--text); box-shadow:none;}
  .btn.secondary:hover{background:var(--glass-hi); border-color:rgba(255,255,255,0.24);}
  .btn.ghost{background:transparent; border:none; color:var(--text-muted); padding:5px 8px; box-shadow:none;}
  .btn.ghost:hover{color:var(--text); background:var(--glass-hi);}
  .btn.danger{color:var(--negative);}
  .btn.ghost.danger:hover{color:var(--negative);}
  .btn:disabled{opacity:.35; cursor:default; box-shadow:none;}
  .form-actions{display:flex; gap:8px; margin-top:14px; justify-content:flex-end;}

  /* ---------- tabelas ---------- */
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.14em; color:var(--text-faint); font-weight:500; padding:11px 12px; background:rgba(255,255,255,0.025); border-bottom:1px solid var(--border); white-space:nowrap;}
  td{padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:top;}
  tbody tr:hover td{background:rgba(255,255,255,0.02);}
  tr:last-child td{border-bottom:none;}
  td.num{font-size:12.5px; white-space:nowrap;}
  .tablewrap{overflow-x:auto;}

  /* ---------- selos ---------- */
  .pill{display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:6px; font-family:var(--mono); font-size:10.5px; font-weight:500; letter-spacing:.1em; text-transform:uppercase; white-space:nowrap; border:1px solid currentColor;}
  .pill::before{content:""; width:5px; height:5px; border-radius:50%; background:currentColor; box-shadow:0 0 6px currentColor;}
  .pill.receita{background:var(--accent-soft); color:var(--positive); border-color:rgba(134,194,156,0.25);}
  .pill.despesa{background:var(--negative-soft); color:var(--negative); border-color:rgba(232,128,111,0.28);}
  .pill.status-andamento{background:rgba(221,184,102,0.10); color:var(--caution); border-color:rgba(221,184,102,0.25);}
  .pill.status-concluida{background:var(--accent-soft); color:var(--positive); border-color:rgba(134,194,156,0.25);}
  .pill.status-atrasada{background:var(--negative-soft); color:var(--negative); border-color:rgba(232,128,111,0.28);}
  .pill.status-pausada{background:transparent; color:var(--text-muted); border-color:var(--border-strong);}
  .rowactions{display:flex; gap:4px; white-space:nowrap;}
  .empty{padding:28px 18px; text-align:center; color:var(--text-muted); font-size:13.5px;}

  /* ---------- progresso ---------- */
  .progress-track{height:3px; border-radius:99px; background:rgba(255,255,255,0.07); overflow:hidden; width:100%;}
  .progress-fill{height:100%; background:var(--positive); border-radius:99px; box-shadow:0 0 8px var(--positive);}

  /* ---------- subabas ---------- */
  .propfirm-bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:18px;}
  .subtabs{display:flex; gap:4px; margin-bottom:18px; border-bottom:1px solid var(--border); overflow-x:auto;}
  .subtab{padding:10px 4px; margin-right:20px; font-family:var(--mono); font-size:11px; font-weight:500; letter-spacing:.1em; text-transform:uppercase; color:var(--text-muted); cursor:pointer; border-bottom:2px solid transparent; background:none; border-top:none;border-left:none;border-right:none; white-space:nowrap; transition:color .15s;}
  .subtab:hover{color:var(--text);}
  .subtab.active{color:var(--text); border-bottom-color:var(--gold); box-shadow:0 8px 12px -10px rgba(201,169,110,0.6);}

  /* ---------- gráficos ---------- */
  .chart-bar{cursor:pointer; transition:opacity .12s, filter .12s; filter:drop-shadow(0 0 6px rgba(255,255,255,0.08));}
  .chart-bar:hover{opacity:.85; filter:drop-shadow(0 0 10px rgba(255,255,255,0.18));}
  .chart-dot{cursor:pointer;}
  .chart-legend{display:flex; gap:16px; flex-wrap:wrap; margin-bottom:8px;}
  .chart-legend span.sw{width:8px; height:8px; border-radius:2px; display:inline-block;}
  .chart-legend .item{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-muted);}
  .chart-tip{position:absolute; pointer-events:none; background:rgba(24,28,25,0.92); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid var(--border-strong); border-radius:10px; padding:7px 10px; font-size:12px; box-shadow:0 20px 50px -20px rgba(0,0,0,0.9); white-space:nowrap; z-index:5; line-height:1.5;}

  /* ---------- planner: cards ---------- */
  .pcard{background:linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.014)); border:1px solid var(--border); border-radius:18px; padding:20px 22px; box-shadow:var(--shadow);}
  .card-top{display:flex; align-items:center; gap:12px; margin-bottom:16px;}
  .card-top h3{font-size:17px; font-weight:500; flex:1;}
  .ico-sq{width:38px; height:38px; border-radius:11px; display:grid; place-items:center; flex-shrink:0; color:var(--gold); background:var(--gold-soft); border:1px solid rgba(201,169,110,0.22);}
  .ico-sq.green{color:var(--positive); background:var(--accent-soft); border-color:rgba(134,194,156,0.22);}
  .t1{font-size:15px; font-weight:500;} .t2{font-size:13.5px; color:var(--text-muted); margin-top:2px;}
  .see-all{background:none; border:none; color:var(--gold); font-size:13px; padding:4px 0; white-space:nowrap;}
  .see-all:hover{color:var(--text);}

  .home-grid{display:grid; grid-template-columns:1.1fr 1fr; gap:14px; margin-top:6px;}
  .banner{grid-column:1/-1; position:relative; overflow:hidden; display:flex; align-items:center; gap:20px; padding:24px 28px; border-radius:18px; border:1px solid rgba(201,169,110,0.2);
    background:radial-gradient(520px 140px at 88% 130%, rgba(201,169,110,0.26), transparent 70%), linear-gradient(100deg, #10231D, #0D1713 58%, var(--brand));}
  .banner .b-icon{color:var(--gold); flex-shrink:0;}
  .banner h3{font-size:21px; font-weight:500;}
  .banner p{margin:5px 0 0; color:var(--text-muted); font-size:13.5px;}
  .banner .b-art{margin-left:auto; color:var(--gold); flex-shrink:0;}

  /* agenda de hoje */
  .ev-list{display:flex; flex-direction:column;}
  .ev-row{display:flex; align-items:center; gap:14px; padding:12px 6px; margin:0 -6px; border-top:1px solid var(--border); cursor:pointer; border-radius:10px; transition:background .15s;}
  .ev-row:first-child{border-top:none;}
  .ev-row:hover{background:var(--glass-hi);}
  .ev-time{width:50px; font-size:13px; color:var(--text-muted); flex-shrink:0;}
  .ev-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0; box-shadow:0 0 8px currentColor;}
  .ev-title{font-size:15px; font-weight:500;} .ev-sub{font-size:13px; color:var(--text-muted); margin-top:2px;}
  .empty-note{font-size:13.5px; color:var(--text-muted); padding:6px 0; line-height:1.55;}

  /* calendário */
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .cal-head h3{font-size:17px; font-weight:500;}
  .cal-nav{display:flex; gap:2px;}
  .icon-btn{width:34px; height:34px; border-radius:9px; border:1px solid transparent; background:transparent; display:grid; place-items:center; color:var(--text-muted); transition:all .15s; padding:0;}
  .icon-btn:hover{background:var(--glass-hi); border-color:var(--border); color:var(--text);}
  .icon-btn.warn:hover{color:var(--negative);}
  .cal-grid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:2px 0; justify-items:center;}
  .cal-dow{width:100%; text-align:center; font-family:var(--mono); font-size:10.5px; color:var(--text-muted); padding:8px 0; letter-spacing:.06em;}
  .cal-day{position:relative; width:36px; height:36px; border:none; background:transparent; color:var(--text); border-radius:50%; font-size:14px; padding:0;}
  .cal-day:hover{background:var(--glass-hi);}
  .cal-day.out{color:var(--text-faint);}
  .cal-day.today{background:var(--gold); color:var(--cream-ink); font-weight:600; box-shadow:0 0 18px rgba(201,169,110,0.45);}
  .cal-day.sel:not(.today){box-shadow:0 0 0 1.5px var(--gold) inset;}
  .cal-day.has::after{content:""; position:absolute; bottom:3px; left:50%; transform:translateX(-50%); width:4px; height:4px; border-radius:50%; background:var(--positive);}
  .cal-day.today.has::after{background:var(--cream-ink);}

  .cal-toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:6px 0 16px;}
  .cal-toolbar h2{font-size:20px; font-weight:500; min-width:170px;}
  .bigcal{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); border:1px solid var(--border); border-radius:18px; overflow:hidden; background:rgba(255,255,255,0.015); margin-bottom:18px;}

  .bigcell{min-height:104px; padding:8px 8px 6px; border-right:1px solid var(--border); border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:4px; cursor:pointer; min-width:0; transition:background .15s;}
  .bigcell:nth-child(7n){border-right:none;}
  .bigcell:hover{background:rgba(255,255,255,0.03);}
  .bigcell.out{background:rgba(0,0,0,0.2);} .bigcell.out .dn{color:var(--text-faint);}
  .bigcell .dn{font-size:12.5px; width:24px; height:24px; display:grid; place-items:center; border-radius:50%; font-family:var(--mono);}
  .bigcell.today .dn{background:var(--gold); color:var(--cream-ink); font-weight:600;}
  .bigcell.sel{background:rgba(201,169,110,0.07); box-shadow:inset 0 0 0 1.5px rgba(201,169,110,0.5);}
  .chip-ev{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .chip-ev i{width:6px; height:6px; border-radius:50%; flex-shrink:0; background:currentColor;}
  .chip-ev span{overflow:hidden; text-overflow:ellipsis; color:var(--text-muted);}
  .more-ev{font-size:10.5px; color:var(--text-faint); font-family:var(--mono);}
  .cell-dots{display:none; gap:3px; justify-content:center;}
  .cell-dots i{width:5px; height:5px; border-radius:50%; background:currentColor;}
  .day-title{font-size:17px; font-weight:500; margin:0;}
  .day-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px;}

  /* tarefas */
  .chk{width:22px; height:22px; border-radius:7px; border:1.5px solid var(--border-strong); background:transparent; flex-shrink:0; display:grid; place-items:center; color:transparent; padding:0; transition:all .15s;}
  .chk:hover{border-color:var(--gold);}
  .chk.on{background:var(--gold); border-color:var(--gold); color:var(--cream-ink);}
  .task-row{display:flex; align-items:center; gap:14px; padding:12px 0; border-top:1px solid var(--border); font-size:15px;}
  .task-row:first-child{border-top:none;}
  .task-row .tt{flex:1; min-width:0; overflow-wrap:anywhere; cursor:pointer;}
  .task-row .tt:hover{color:var(--gold);}
  .task-row.done .tt{text-decoration:line-through; color:var(--text-muted);}
  .task-row .ts{font-family:var(--mono); font-size:11px; color:var(--text-muted); white-space:nowrap; letter-spacing:.04em;}
  .task-row .ts.late{color:var(--negative);}
  .task-row .acts{display:flex; gap:2px;}
  .tasks-card .task-row{padding:11px 0;}
  .add-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .inp{background:rgba(0,0,0,0.3); border:1px solid var(--border); border-radius:10px; padding:11px 14px; color:var(--text); font-size:14px; min-width:0; transition:border-color .15s, box-shadow .15s;}
  .inp::placeholder{color:var(--text-faint);}
  .inp:focus{outline:none; border-color:rgba(201,169,110,0.5); box-shadow:0 0 0 3px rgba(201,169,110,0.12);}
  .add-row .inp.grow{flex:1; min-width:200px;}
  input[type="date"], input[type="time"]{color-scheme:dark;}
  .toolbar{display:flex; gap:10px; margin:16px 0 14px; flex-wrap:wrap; align-items:center;}
  .chips{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{padding:7px 12px; border-radius:8px; border:1px solid var(--border); background:rgba(255,255,255,0.02); font-family:var(--mono); font-size:10.5px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); transition:all .15s;}
  .chip:hover{color:var(--text); border-color:var(--border-strong);}
  .chip[aria-pressed="true"]{background:var(--cream); border-color:var(--cream); color:var(--cream-ink);}

  /* ações rápidas */
  .q-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .q-tile{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:18px 8px; min-height:92px; border-radius:14px; border:1px solid var(--border); background:rgba(255,255,255,0.03); color:var(--text); font-size:12.5px; text-align:center; line-height:1.3; transition:all .15s;}
  .q-tile svg{color:var(--gold);}
  .q-tile:hover{background:var(--glass-hi); border-color:rgba(201,169,110,0.4); transform:translateY(-1px);}

  /* anotações */
  .search{flex:1; min-width:180px; background:rgba(255,255,255,0.025); border:1px solid var(--border); border-radius:10px; padding:11px 14px; font-size:14px; color:var(--text); transition:border-color .15s;}
  .search::placeholder{color:var(--text-faint);}
  .search:focus{outline:none; border-color:var(--border-strong);}
  .notes-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px;}
  .note-card{display:flex; flex-direction:column; gap:8px; min-height:150px; padding:18px 18px 14px; border-radius:16px; border:1px solid var(--border); background:linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.014)); cursor:pointer; transition:all .15s;}
  .note-card:hover{border-color:rgba(201,169,110,0.4); transform:translateY(-1px);}
  .note-card h3{font-size:15.5px; font-weight:500;}
  .note-card p{margin:0; color:var(--text-muted); font-size:13.5px; line-height:1.5; display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden; white-space:pre-wrap; overflow-wrap:anywhere;}
  .note-card small{margin-top:auto; font-family:var(--mono); font-size:10.5px; color:var(--text-faint); letter-spacing:.08em; text-transform:uppercase;}

  /* botão flutuante + menu */
  .fab{position:fixed; right:28px; bottom:28px; width:58px; height:58px; border-radius:50%; border:none; background:var(--gold); color:var(--cream-ink); display:grid; place-items:center; z-index:40; padding:0;
    box-shadow:0 14px 34px -10px rgba(201,169,110,0.55), 0 0 0 6px rgba(201,169,110,0.08); transition:transform .18s;}
  .fab:hover{transform:scale(1.05);} .fab.open{transform:rotate(45deg);}
  .fab-menu{position:fixed; right:28px; bottom:100px; z-index:40; display:flex; flex-direction:column; gap:8px; align-items:flex-end; animation:fadeIn .15s ease both;}
  .fab-item{display:flex; align-items:center; gap:10px; padding:10px 16px; border-radius:12px; border:1px solid var(--border-strong); background:rgba(24,28,25,0.94); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); color:var(--text); font-size:13.5px; box-shadow:0 20px 40px -20px rgba(0,0,0,0.9);}
  .fab-item svg{color:var(--gold);}
  .fab-item:hover{border-color:rgba(201,169,110,0.5);}

  /* modais e aviso */
  .overlay{position:fixed; inset:0; background:rgba(4,5,5,0.7); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; animation:fadeIn .18s ease both;}
  .overlay[hidden]{display:none;}
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  .modal{background:linear-gradient(180deg, #161A17, #101311); border:1px solid var(--border-strong); border-radius:18px; padding:24px 24px 20px; width:100%; max-width:440px; box-shadow:0 1px 0 rgba(255,255,255,0.06) inset, 0 40px 80px -30px rgba(0,0,0,0.9); max-height:90vh; overflow-y:auto; animation:popIn .22s cubic-bezier(.2,.8,.2,1) both;}
  @keyframes popIn{ from{opacity:0; transform:translateY(8px) scale(.985);} to{opacity:1; transform:none;} }
  .modal h3{margin:0 0 18px; font-size:20px; font-weight:400;}
  .modal .field{margin-bottom:14px;}
  .field-row{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:8px; padding-top:14px; border-top:1px solid var(--border);}
  .btn.danger-outline{background:transparent; border-color:rgba(232,128,111,0.4); color:var(--negative); box-shadow:none;}
  .btn.danger-outline:hover{background:var(--negative-soft);}
  .notif-sec{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-muted); margin:14px 0 6px;}
  .notif-sec:first-of-type{margin-top:0;}
  .toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:rgba(24,28,25,0.94); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid var(--border-strong); color:var(--text); padding:11px 16px; border-radius:11px; font-size:13px; display:flex; align-items:center; gap:14px; box-shadow:0 20px 50px -20px rgba(0,0,0,0.9); z-index:60; max-width:90vw;}
  .toast::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--positive); box-shadow:0 0 8px var(--positive); flex-shrink:0;}
  .toast[hidden]{display:none;} .toast button{background:none; border:none; color:var(--gold); font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; font-weight:500;}
  .cfg-grid{display:grid; gap:14px; max-width:620px;}
  .modal.wide{max-width:560px;}
  .offline{margin-top:78px; padding:14px 18px; color:var(--negative);}

  /* ---------- celular ---------- */
  @media (max-width:900px){
    .home-grid{grid-template-columns:1fr;}
  }
  @media (max-width:760px){
    .shell{flex-direction:column;}
    .sidebar{
      top:auto; width:100%; height:auto; flex-direction:row; align-items:center; gap:0; padding:8px 4px; overflow:visible;
      bottom:0; left:0; right:0; z-index:35; border-right:none; border-top:1px solid var(--border);
      background:rgba(11,13,12,0.92);
      padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));
    }
    .logo, .side-user{display:none;}
    nav.navlist{flex-direction:row; width:100%; justify-content:space-around; gap:0;}
    .navitem{flex-direction:column; gap:4px; font-size:10px; padding:7px 2px; width:auto; flex:1; min-width:0; border-radius:10px; justify-content:center; letter-spacing:0;}
    .navitem svg{width:20px; height:20px;}
    .navitem.active{background:var(--brand-2); box-shadow:none;}
    .lbl-l{display:none;} .lbl-s{display:inline;}
    .main{margin-left:0; padding:0 16px 150px;}
    .appbar{position:static; width:100%; justify-content:space-between; padding:calc(16px + env(safe-area-inset-top,0px)) 0 0;}
    .appbar .appbar-right{display:flex; align-items:center; gap:6px;}
    .m-logo{display:flex; align-items:center; gap:10px;}
    .m-logo .logo-mark{width:38px; height:38px; border-radius:11px;}
    .hello, .pagehead{padding:18px 0 16px;}
    .hello h1, .pagehead h1{font-size:28px;}
    .hello p, .pagehead p{font-size:15px;}
    .seg{margin-top:12px;}
    .fab{right:18px; bottom:calc(86px + env(safe-area-inset-bottom,0px)); width:54px; height:54px;}
    .fab-menu{right:18px; bottom:calc(152px + env(safe-area-inset-bottom,0px));}
    .toast{bottom:calc(150px + env(safe-area-inset-bottom,0px));}
    .pcard{padding:18px 16px;}
    .banner{padding:18px;} .banner h3{font-size:18px;} .banner .b-art{display:none;}
    .bigcell{min-height:58px; padding:5px 2px; align-items:center;}
    .bigcell .chip-ev, .bigcell .more-ev{display:none;}
    .bigcell .cell-dots{display:flex;}
    .cal-toolbar h2{min-width:0; flex:1 1 100%; order:-1;}
    .field-row{grid-template-columns:1fr;}
    .offline{margin-top:14px;}
    .task-row .ts{font-size:10.5px;}
    .add-row .inp[type="date"], .add-row .inp[type="time"]{flex:1 1 40%;}
  }
  @media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important;} }
  [hidden]{display:none!important;}
</style>
</head>
<body>


<div class="shell">
  <aside class="sidebar">
    <div class="logo" id="logo"></div>
    <nav class="navlist" id="navlist"></nav>
    <button class="side-user" id="side-user" data-tab="config" aria-label="Configurações"></button>
  </aside>

  <div class="main">
    <div class="appbar">
      <div class="m-logo" id="m-logo"></div>
      <div class="appbar-right">
        <button class="bell" id="bell" aria-label="Notificações"></button>
        <button class="avatar big" id="avatar-top" data-tab="config" aria-label="Configurações">G</button>
      </div>
    </div>

    <div class="seg" id="fin-subnav" hidden></div>

    <section id="tab-inicio"></section>
    <section id="tab-calendario" hidden></section>
    <section id="tab-tarefas" hidden></section>
    <section id="tab-anotacoes" hidden></section>
    <section id="tab-config" hidden></section>
    <section id="tab-dashboard" hidden></section>
    <section id="tab-lancamentos" hidden></section>
    <section id="tab-metas" hidden></section>
    <section id="tab-investimentos" hidden></section>
    <section id="tab-forex" hidden></section>
  </div>
</div>

<button class="fab" id="fab" aria-label="Adicionar" aria-expanded="false"></button>
<div class="fab-menu" id="fab-menu" hidden></div>
<div class="overlay" id="overlay" hidden><div class="modal" id="modal"></div></div>
<div class="toast" id="toast" hidden><span id="toast-msg"></span><button id="toast-undo" hidden>Desfazer</button></div>

<script>
(function(){
  "use strict";

  var RECEITA_CATS = ["Salário","Freelance/Consultoria","Rendimento de Investimentos","Outras Receitas"];
  var DESPESA_CATS = ["Moradia","Alimentação","Transporte","Saúde","Lazer","Educação","Assinaturas","Impostos","Outras Despesas"];
  var META_STATUS = ["Em andamento","Concluída","Atrasada","Pausada"];
  var MESES_ABREV = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  var MESES_FULL = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  var SERIES_COLORS = ["var(--series-1)","var(--series-2)","var(--series-3)","var(--series-4)"];

  var state = {
    db: null,
    tab: "dashboard",
    transacoes: [],
    metas: [],
    investimentos: [],
    propfirms: [],
    operacoesForex: [],
    forexSubtab: "operacoes",
    forexRelatorio: { periodo: "semanal", ref: null },
    opFiltroPropfirm: "",
    lancSubtab: "lista",
    lancFiltro: { mes: "", ano: "", tipo: "" },
    editing: { transacao: null, meta: null, investimento: null, operacao: null, propfirm: null },
    unsub: {}
  };

  function fmtBRL(n){
    n = Number(n) || 0;
    return "R$ " + n.toLocaleString("pt-BR", {minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function fmtUSD(n){
    n = Number(n) || 0;
    return (n<0?"-$":"$") + Math.abs(n).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function fmtDate(iso){
    if(!iso) return "—";
    var p = iso.split("-");
    if(p.length!==3) return iso;
    return p[2]+"/"+p[1]+"/"+p[0];
  }
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }
  function slugify(s){
    return String(s).toLowerCase()
      .normalize("NFD").replace(/[̀-ͯ]/g,"")
      .replace(/[^a-z0-9.]+/g,"-").replace(/^-+|-+$/g,"") || ("propfirm-"+Date.now());
  }
  function metaStatusClass(status){
    var map = { "Em andamento":"status-andamento", "Concluída":"status-concluida", "Atrasada":"status-atrasada", "Pausada":"status-pausada" };
    return map[status] || "status-andamento";
  }
  function optionsHtml(list, selected){
    return list.map(function(c){
      return '<option value="'+esc(c)+'"'+(c===selected?" selected":"")+'>'+esc(c)+'</option>';
    }).join("");
  }
  function seriesColor(i){ return SERIES_COLORS[i % SERIES_COLORS.length]; }

  // ---------------- date / period helpers ----------------
  function pad2(n){ return (n<10?"0":"")+n; }
  function parseISODate(iso){
    var p = String(iso).split("-").map(Number);
    return new Date(p[0]||1970, (p[1]||1)-1, p[2]||1);
  }
  function toISODate(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
  function toTs(iso){ return parseISODate(iso).getTime(); }

  function periodoRange(periodo, ref){
    var d = parseISODate(ref);
    if(periodo==="semanal"){
      var day = (d.getDay()+6)%7;
      var start = new Date(d.getFullYear(), d.getMonth(), d.getDate()-day);
      var end = new Date(start.getFullYear(), start.getMonth(), start.getDate()+6);
      return { start: toISODate(start), end: toISODate(end) };
    }
    if(periodo==="quinzenal"){
      if(d.getDate()<=15){
        return { start: toISODate(new Date(d.getFullYear(), d.getMonth(), 1)), end: toISODate(new Date(d.getFullYear(), d.getMonth(), 15)) };
      }
      return { start: toISODate(new Date(d.getFullYear(), d.getMonth(), 16)), end: toISODate(new Date(d.getFullYear(), d.getMonth()+1, 0)) };
    }
    return { start: toISODate(new Date(d.getFullYear(), d.getMonth(), 1)), end: toISODate(new Date(d.getFullYear(), d.getMonth()+1, 0)) };
  }
  function periodoLabel(periodo, range){
    var s = parseISODate(range.start), e = parseISODate(range.end);
    if(periodo==="mensal") return MESES_FULL[s.getMonth()]+" de "+s.getFullYear();
    var sameMonth = s.getMonth()===e.getMonth() && s.getFullYear()===e.getFullYear();
    if(sameMonth) return s.getDate()+"–"+e.getDate()+" "+MESES_ABREV[s.getMonth()]+" "+s.getFullYear();
    return s.getDate()+" "+MESES_ABREV[s.getMonth()]+" – "+e.getDate()+" "+MESES_ABREV[e.getMonth()]+" "+e.getFullYear();
  }
  function periodoNav(periodo, rangeStart, dir){
    var d = parseISODate(rangeStart);
    if(periodo==="semanal"){
      var nd = new Date(d.getFullYear(), d.getMonth(), d.getDate()+7*dir);
      return toISODate(nd);
    }
    if(periodo==="quinzenal"){
      if(d.getDate()===1){
        return dir<0 ? toISODate(new Date(d.getFullYear(), d.getMonth()-1, 16)) : toISODate(new Date(d.getFullYear(), d.getMonth(), 16));
      }
      return dir<0 ? toISODate(new Date(d.getFullYear(), d.getMonth(), 1)) : toISODate(new Date(d.getFullYear(), d.getMonth()+1, 1));
    }
    return toISODate(new Date(d.getFullYear(), d.getMonth()+dir, 1));
  }

  // ---------------- armazenamento local (fica só neste aparelho) ----------------
  var DB_KEY = "gabriel-planner-db-v1";
  function localDb(){
    var listeners = [];
    function load(){ try{ return JSON.parse(localStorage.getItem(DB_KEY)||"{}") || {}; }catch(e){ return {}; } }
    function save(d){ localStorage.setItem(DB_KEY, JSON.stringify(d)); }
    function notify(){ listeners.slice().forEach(function(f){ try{ f(); }catch(e){} }); }
    window.addEventListener("storage", function(e){ if(e.key===DB_KEY) notify(); });
    function clone(o){ return JSON.parse(JSON.stringify(o)); }
    function newId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
    function mutate(fn){
      return new Promise(function(res, rej){
        try{ var d = load(); var out = fn(d); save(d); setTimeout(notify, 0); res(out); }catch(e){ rej(e); }
      });
    }
    function snapDoc(id, data){ return { id:id, exists:!!data, data:function(){ return data ? clone(data) : undefined; } }; }
    function sub(f){
      listeners.push(f); setTimeout(f, 0);
      return function(){ var i = listeners.indexOf(f); if(i>=0) listeners.splice(i,1); };
    }
    function docRef(col, id){
      return {
        id:id,
        get:function(){ var c = load()[col] || {}; return Promise.resolve(snapDoc(id, c[id])); },
        set:function(data){ return mutate(function(d){ (d[col] = d[col] || {})[id] = clone(data); }); },
        update:function(data){ return mutate(function(d){ var c = d[col] = d[col] || {}; c[id] = Object.assign({}, c[id] || {}, clone(data)); }); },
        delete:function(){ return mutate(function(d){ if(d[col]) delete d[col][id]; }); },
        onSnapshot:function(cb){ return sub(function(){ var c = load()[col] || {}; cb(snapDoc(id, c[id])); }); }
      };
    }
    function query(col, ord){
      return {
        orderBy:function(f, dir){ return query(col, { f:f, dir:dir||"asc" }); },
        onSnapshot:function(cb){
          return sub(function(){
            var c = load()[col] || {};
            var docs = Object.keys(c).map(function(id){ return snapDoc(id, c[id]); });
            if(ord){
              docs.sort(function(a, b){
                var x = a.data()[ord.f], y = b.data()[ord.f];
                var r = x===y ? 0 : (x==null ? 1 : (y==null ? -1 : (x<y ? -1 : 1)));
                return ord.dir==="desc" ? -r : r;
              });
            }
            cb({ docs:docs });
          });
        },
        add:function(data){
          var id = newId();
          return mutate(function(d){ (d[col] = d[col] || {})[id] = clone(data); }).then(function(){ return docRef(col, id); });
        }
      };
    }
    return {
      collection:function(name){ return query(name, null); },
      doc:function(path){ var p = path.split("/"); return docRef(p[0], p.slice(1).join("/")); }
    };
  }

  // ---------------- backup (exportar e importar) ----------------
  function exportarBackup(){
    var txt = localStorage.getItem(DB_KEY) || "{}";
    var nome = "gabriel-planner-backup-" + todayISO() + ".json";
    var blob = new Blob([txt], { type:"application/json" });
    try{
      var file = new File([blob], nome, { type:"application/json" });
      if(navigator.canShare && navigator.canShare({ files:[file] })){
        navigator.share({ files:[file], title:"Backup do Gabriel Planner" }).catch(function(){});
        return;
      }
    }catch(e){}
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();
    toast("Backup baixado");
  }
  function importarBackup(file){
    var r = new FileReader();
    r.onload = function(){
      try{
        var d = JSON.parse(String(r.result));
        if(!d || typeof d!=="object" || Array.isArray(d)) throw new Error("formato");
        localStorage.setItem(DB_KEY, JSON.stringify(d));
        toast("Backup restaurado");
        setTimeout(function(){ location.reload(); }, 600);
      }catch(e){ toast("Esse arquivo não parece um backup do Planner."); }
    };
    r.readAsText(file);
  }

    state.unsub.tarefas = db.collection("tarefas").onSnapshot(function(snap){ state.tarefas = mapDocs(snap); plannerChanged(); }, function(){});
    state.unsub.anotacoes = db.collection("anotacoes").onSnapshot(function(snap){ state.anotacoes = mapDocs(snap); plannerChanged(); }, function(){});

  function evsDoDia(iso){
    return state.compromissos.filter(function(e){ return e.data===iso; })
      .sort(function(a,b){ return (a.hora||"99:99") < (b.hora||"99:99") ? -1 : ((a.hora||"99:99") > (b.hora||"99:99") ? 1 : 0); });
  }
  function tarefasPend(){ return state.tarefas.filter(function(t){ return !t.feita; }); }
  function tarefasDoDia(iso){ return tarefasPend().filter(function(t){ return t.prazo===iso; }); }
  function cmpTarefa(a,b){
    var pa = a.prazo || "9999-99-99", pb = b.prazo || "9999-99-99";
    if(pa!==pb) return pa<pb ? -1 : 1;
    var ha = a.hora || "99:99", hb = b.hora || "99:99";
    if(ha!==hb) return ha<hb ? -1 : 1;
    return (a.criadaEm||"") < (b.criadaEm||"") ? -1 : 1;
  }
  function diasMarcados(){
    var m = {};
    state.compromissos.forEach(function(e){ if(e.data) m[e.data] = true; });
    tarefasPend().forEach(function(t){ if(t.prazo) m[t.prazo] = true; });
    return m;
  }
  function monthCells(y, m){
    var first = new Date(y, m, 1), dim = new Date(y, m+1, 0).getDate();
    var rows = Math.ceil((first.getDay()+dim)/7), out = [];
    var start = new Date(y, m, 1-first.getDay());
    for(var i=0;i<rows*7;i++){
      var d = new Date(start.getFullYear(), start.getMonth(), start.getDate()+i);
      out.push({ iso:toISODate(d), d:d.getDate(), out:d.getMonth()!==m });
    }
    return out;
  }
  function contaAvisos(){
    var iso = todayISO();
    return evsDoDia(iso).length + tarefasPend().filter(function(t){ return t.prazo && t.prazo<=iso; }).length;
  }

  // ---------------- planner: gravação ----------------
  function dbOk(){
    if(!state.db){ toast("Sem conexão com o armazenamento. Abra pelo link do Claude, logado na sua conta."); return false; }
    return true;
  }
  function gravar(col, id, data, msg){
    if(!dbOk()) return Promise.resolve(false);
    var p = id ? state.db.doc(col+"/"+id).update(data) : state.db.collection(col).add(data);
    return p.then(function(){ if(msg) toast(msg); return true; })
      .catch(function(){ toast("Não consegui salvar agora. Tenta de novo."); return false; });
  }
  function apagar(col, item, msg){
    if(!dbOk()) return Promise.resolve(false);
    var copia = Object.assign({}, item); delete copia.id;
    return state.db.doc(col+"/"+item.id).delete().then(function(){
      toast(msg, function(){ state.db.doc(col+"/"+item.id).set(copia); });
      return true;
    }).catch(function(){ toast("Não consegui excluir agora. Tenta de novo."); return false; });
  }
  function toggleTarefa(id){
    var t = state.tarefas.find(function(x){ return x.id===id; });
    if(!t || !dbOk()) return;
    gravar("tarefas", id, { feita: !t.feita, concluidaEm: !t.feita ? new Date().toISOString() : "" });
  }

  function pfield(label, name, type, value, placeholder){

    var input = type==="textarea"
      ? '<textarea '+attrs+' rows="8">'+esc(value)+'</textarea>'
      : '<input type="'+type+'" '+attrs+' value="'+esc(value)+'">';

  }
  function pselect(label, name, options, selected){

  function openModal(title, body, o){
    o = o || {};
    var m = $("modal");
    m.className = "modal" + (o.wide ? " wide" : "");
    m.innerHTML = '<h3>'+esc(title)+'</h3><form id="modal-form" autocomplete="off">'+body+
      '<div class="modal-actions">'+
        (o.onDelete ? '<button type="button" class="btn danger-outline" id="modal-del">Excluir</button><span style="flex:1"></span>' : '')+
        '<button type="button" class="btn secondary" id="modal-cancel">'+(o.noSubmit?"Fechar":"Cancelar")+'</button>'+
        (o.noSubmit ? '' : '<button type="submit" class="btn">'+esc(o.submitLabel||"Salvar")+'</button>')+
      '</div></form>';
    $("overlay").hidden = false;
    var f = $("modal-form");
    f.addEventListener("submit", function(ev){
      ev.preventDefault();
      if(!o.onSubmit) return;
      Promise.resolve(o.onSubmit(new FormData(f))).then(function(ok){ if(ok!==false) closeModal(); });
    });
    $("modal-cancel").addEventListener("click", closeModal);
    if(o.onDelete) $("modal-del").addEventListener("click", function(){
      Promise.resolve(o.onDelete()).then(function(ok){ if(ok!==false) closeModal(); });
    });
    var first = f.querySelector("input,textarea,select");
    if(first && !o.noSubmit) setTimeout(function(){ try{ first.focus(); }catch(e){} }, 30);
  }
  function closeModal(){ var o = $("overlay"); if(o){ o.hidden = true; $("modal").innerHTML = ""; } }

  var toastTimer = null;

    $("toast-msg").textContent = msg;

    $("toast").hidden = false;

    toastTimer = setTimeout(function(){ $("toast").hidden = true; }, undo ? 6000 : 3500);
  }

  function abrirAvisos(){
    var iso = todayISO(), evs = evsDoDia(iso);
    var atras = tarefasPend().filter(function(t){ return t.prazo && t.prazo<iso; }).sort(cmpTarefa);
    var hoje = tarefasDoDia(iso);
    var html = "";
    if(evs.length) html += '<div class="notif-sec">Compromissos de hoje</div>' + evs.map(evRow).join("");
    if(hoje.length) html += '<div class="notif-sec">Tarefas para hoje</div>' + hoje.map(function(t){ return taskRow(t,true); }).join("");
    if(atras.length) html += '<div class="notif-sec">Tarefas atrasadas</div>' + atras.map(function(t){ return taskRow(t,true); }).join("");
    if(!html) html = '<p class="empty-note">Tudo em dia. Nada pendente pra hoje.</p>';
    openModal("Avisos", html, { noSubmit:true });
  }

  function evRow(e){
    return '<div class="ev-row" data-ev="'+e.id+'"><span class="ev-time num">'+(e.hora?esc(e.hora):"—")+'</span>' +
      '<span class="ev-dot" style="background:'+catCor(e.categoria)+';color:'+catCor(e.categoria)+';"></span>' +

  function prazoTxt(t){
    var p = t.prazo ? fmtDate(t.prazo) : "";
    if(t.hora) p += (p ? " · " : "") + t.hora;

  function taskRow(t, compact){

  function closeFab(){

    $("fab").classList.remove("open");
    $("fab").setAttribute("aria-expanded","false");

  function quick(kind){
    closeFab();
    if(kind==="evento") abrirEvento(null, state.tab==="calendario" ? state.calSel : todayISO());
    else if(kind==="evento-dia") abrirEvento(null, state.calSel);
    else if(kind==="tarefa") abrirTarefa(null);
    else if(kind==="anotacao") abrirNota(null);
    else if(kind==="lancamento") showTab("lancamentos");

  function calNav(dir){

    state.calView = { y:d.getFullYear(), m:d.getMonth() };
    renderPlannerTab(state.tab);

  function pickDay(iso){
    state.calSel = iso;
    var d = parseISODate(iso);
    state.calView = { y:d.getFullYear(), m:d.getMonth() };
    if(state.tab==="inicio") showTab("calendario"); else renderCalendario();

  function onClick(e){
    var t = e.target, b;
    if(!t || !t.closest) return;
    if(t.closest("#fab")){ toggleFab(); return; }
    if(!t.closest("#fab-menu")) closeFab();
    if((b = t.closest("[data-toggle-task]"))){ toggleTarefa(b.getAttribute("data-toggle-task")); return; }
    if((b = t.closest("[data-edit-task]"))){ abrirTarefa(b.getAttribute("data-edit-task")); return; }
    if((b = t.closest("[data-del-task]"))){
      var tk = state.tarefas.find(function(x){ return x.id===b.getAttribute("data-del-task"); });
      if(tk) apagar("tarefas", tk, "Tarefa excluída");
      return;
    }
    if((b = t.closest("[data-ev]"))){ closeModal(); abrirEvento(b.getAttribute("data-ev")); return; }
    if((b = t.closest("[data-note]"))){ abrirNota(b.getAttribute("data-note")); return; }
    if((b = t.closest("[data-quick]"))){ quick(b.getAttribute("data-quick")); return; }
    if((b = t.closest("[data-cal-nav]"))){ calNav(Number(b.getAttribute("data-cal-nav"))); return; }
    if((b = t.closest("[data-cal-today]"))){ var n = new Date(); state.calView = { y:n.getFullYear(), m:n.getMonth() }; state.calSel = toISODate(n); renderCalendario(); return; }
    if((b = t.closest("[data-day]"))){ pickDay(b.getAttribute("data-day")); return; }
    if((b = t.closest("[data-filtro]"))){ state.tarefaFiltro = b.getAttribute("data-filtro"); renderTarefasLista(); return; }
    if((b = t.closest("[data-goto]"))){ showTab(b.getAttribute("data-goto")); return; }
    if((b = t.closest("[data-fin]"))){ showTab(b.getAttribute("data-fin")); return; }
    if(t.closest("#bell")){ abrirAvisos(); return; }
    if((b = t.closest("[data-tab]"))){ showTab(b.getAttribute("data-tab")); return; }
  }

  function renderDashboardCards(){
    var cardsEl = document.getElementById("dash-cards");
    if(!cardsEl) return;
    var totalReceitas = state.transacoes.filter(function(t){return t.tipo==="Receita";}).reduce(function(s,t){return s+(Number(t.valor)||0);},0);
    var totalDespesas = state.transacoes.filter(function(t){return t.tipo==="Despesa";}).reduce(function(s,t){return s+(Number(t.valor)||0);},0);
    var saldo = totalReceitas - totalDespesas;
    var metasAtivas = state.metas.filter(function(m){return m.status==="Em andamento";}).length;
    var progresso = state.metas.filter(function(m){return Number(m.valorAlvo)>0;});
    var progressoMedio = progresso.length ? progresso.reduce(function(s,m){return s+(Number(m.valorAtual)||0)/Number(m.valorAlvo);},0)/progresso.length*100 : 0;
    var forexTotal = forexTotalAll();

    cardsEl.innerHTML =
      card("Saldo", fmtBRL(saldo), saldo>=0?"positive":"negative") +
      card("Total de Receitas", fmtBRL(totalReceitas)) +
      card("Total de Despesas", fmtBRL(totalDespesas)) +
      card("Resultado Forex (todas propfirms)", fmtUSD(forexTotal), forexTotal>=0?"positive":"negative") +
      card("Metas Ativas", String(metasAtivas)) +
      card("Progresso Médio das Metas", progressoMedio.toFixed(1)+"%");
  }
  function card(label, value, cls, sub){
    return '<div class="card"><div class="label">'+esc(label)+'</div><div class="value num'+(cls?" "+cls:"")+'">'+value+'</div>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</div>';
  }

  function renderDashboardCategorias(){
    var wrap = document.getElementById("dash-cat-table");
    if(!wrap) return;
    var byCat = {};
    DESPESA_CATS.forEach(function(c){ byCat[c]=0; });
    state.transacoes.filter(function(t){return t.tipo==="Despesa";}).forEach(function(t){
      var c = t.categoria || "Outras Despesas";
      byCat[c] = (byCat[c]||0) + (Number(t.valor)||0);
    });
    var rows = Object.keys(byCat).map(function(c){
      return "<tr><td>"+esc(c)+"</td><td class=\"num\">"+fmtBRL(byCat[c])+"</td></tr>";
    }).join("");
    wrap.innerHTML = '<table><thead><tr><th>Categoria</th><th>Total Gasto</th></tr></thead><tbody>'+rows+'</tbody></table>';
  }

  // ---------------- charts ----------------
  function renderLineChart(containerId, series, opts){
    opts = opts || {};
    var el = document.getElementById(containerId);
    if(!el) return;
    var w = 640, h = opts.height || 220;
    var padL=52, padR=14, padT=16, padB=28;
    var innerW = w-padL-padR, innerH = h-padT-padB;
    var yFormat = opts.yFormat || function(v){return v.toFixed(0);};

    var allPts = [];
    series.forEach(function(s){ allPts = allPts.concat(s.points); });
    if(!allPts.length){ el.innerHTML = '<div class="empty">Sem dados suficientes ainda.</div>'; return; }

    var tMin = Math.min.apply(null, allPts.map(function(p){return p.t;}));
    var tMax = Math.max.apply(null, allPts.map(function(p){return p.t;}));
    if(tMin===tMax){ tMin -= 86400000; tMax += 86400000; }
    var yVals = allPts.map(function(p){return p.y;});
    var yMin = Math.min(0, Math.min.apply(null,yVals));
    var yMax = Math.max(0, Math.max.apply(null,yVals));
    if(yMin===yMax){ yMax = yMin + 1; }
    var padY = (yMax-yMin)*0.12 || 1;
    yMin -= padY; yMax += padY;

    function xScale(t){ return padL + (t-tMin)/(tMax-tMin)*innerW; }
    function yScale(y){ return padT + innerH - (y-yMin)/(yMax-yMin)*innerH; }

    var gridLines = "", gridLabels = "";
    var steps = 4;
    for(var i=0;i<=steps;i++){
      var yv = yMin + (yMax-yMin)*i/steps;
      var yy = yScale(yv);
      gridLines += '<line x1="'+padL+'" y1="'+yy.toFixed(1)+'" x2="'+(w-padR)+'" y2="'+yy.toFixed(1)+'" style="stroke:var(--border);stroke-width:1;"/>';
      gridLabels += '<text x="'+(padL-8)+'" y="'+(yy+4).toFixed(1)+'" text-anchor="end" font-size="10.5" style="fill:var(--text-muted);">'+esc(yFormat(yv))+'</text>';
    }
    var zeroY = yScale(0);
    var zeroLine = '<line x1="'+padL+'" y1="'+zeroY.toFixed(1)+'" x2="'+(w-padR)+'" y2="'+zeroY.toFixed(1)+'" style="stroke:var(--text-muted);stroke-width:1;stroke-dasharray:3,3;"/>';

    var xLabelsHtml = "";
    [0,0.5,1].forEach(function(f){
      var t = tMin + (tMax-tMin)*f;
      var xx = xScale(t);
      var d = new Date(t);
      var lbl = pad2(d.getDate())+"/"+pad2(d.getMonth()+1);
      var anchor = f===0?"start":(f===1?"end":"middle");
      xLabelsHtml += '<text x="'+xx.toFixed(1)+'" y="'+(h-8)+'" text-anchor="'+anchor+'" font-size="10.5" style="fill:var(--text-muted);">'+lbl+'</text>';
    });

    var pathsHtml = "", dotsHtml = "", labelsHtml = "";
    series.forEach(function(s, si){
      var pts = s.points.slice().sort(function(a,b){return a.t-b.t;});
      var d = pts.map(function(p,i){ return (i===0?"M":"L")+xScale(p.t).toFixed(1)+","+yScale(p.y).toFixed(1); }).join(" ");
      pathsHtml += '<path d="'+d+'" style="fill:none;stroke:'+s.color+';stroke-width:2;" stroke-linecap="round" stroke-linejoin="round"/>';
      pts.forEach(function(p){
        dotsHtml += '<circle cx="'+xScale(p.t).toFixed(1)+'" cy="'+yScale(p.y).toFixed(1)+'" r="3" style="fill:'+s.color+';" class="chart-dot"></circle>';
      });
      var last = pts[pts.length-1];
      if(last){
        labelsHtml += '<text x="'+(xScale(last.t)+6).toFixed(1)+'" y="'+(yScale(last.y)+4).toFixed(1)+'" font-size="11" font-weight="600" style="fill:var(--text);">'+esc(s.label)+'</text>';
      }
    });

    var legendHtml = "";
    if(series.length>1){
      legendHtml = '<div class="chart-legend">' + series.map(function(s){
        return '<span class="item"><span class="sw" style="background:'+s.color+';"></span>'+esc(s.label)+'</span>';
      }).join("") + '</div>';
    }

    el.innerHTML =
      legendHtml +
      '<div style="position:relative;">' +
        '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:'+h+'px;display:block;">' +
          gridLines + zeroLine + pathsHtml + dotsHtml + gridLabels + xLabelsHtml + labelsHtml +
          '<line id="'+containerId+'-crosshair" x1="0" y1="'+padT+'" x2="0" y2="'+(padT+innerH)+'" style="stroke:var(--text-muted);stroke-width:1;stroke-dasharray:3,3;display:none;"></line>' +
          '<rect x="'+padL+'" y="'+padT+'" width="'+innerW+'" height="'+innerH+'" fill="transparent" id="'+containerId+'-overlay" style="cursor:crosshair;"></rect>' +
        '</svg>' +
        '<div id="'+containerId+'-tip" class="chart-tip" hidden></div>' +
      '</div>';

    var svg = el.querySelector("svg");
    var overlay = document.getElementById(containerId+"-overlay");
    var tip = document.getElementById(containerId+"-tip");
    var crosshair = document.getElementById(containerId+"-crosshair");

    overlay.addEventListener("mousemove", function(ev){
      var rect = svg.getBoundingClientRect();
      var scaleX = w/rect.width;
      var svgX = (ev.clientX-rect.left)*scaleX;
      var t = tMin + (svgX-padL)/innerW*(tMax-tMin);
      var lines = [];
      series.forEach(function(s){
        var nearest = null, best = Infinity;
        s.points.forEach(function(p){ var diff=Math.abs(p.t-t); if(diff<best){best=diff; nearest=p;} });
        if(nearest){
          var d = new Date(nearest.t);
          lines.push('<div><strong style="color:'+s.color+';">'+esc(s.label)+'</strong>: '+esc(yFormat(nearest.y))+' <span style="color:var(--text-muted);">('+pad2(d.getDate())+"/"+pad2(d.getMonth()+1)+"/"+d.getFullYear()+')</span></div>');
        }
      });
      tip.innerHTML = lines.join("");
      tip.hidden = false;
      tip.style.left = (ev.clientX - rect.left + 12)+"px";
      tip.style.top = (ev.clientY - rect.top - 10)+"px";
      crosshair.setAttribute("x1", svgX.toFixed(1));
      crosshair.setAttribute("x2", svgX.toFixed(1));
      crosshair.style.display = "block";
    });
    overlay.addEventListener("mouseleave", function(){ tip.hidden = true; crosshair.style.display = "none"; });
  }

  function renderBarChart(containerId, categories, series, opts){
    opts = opts || {};
    var el = document.getElementById(containerId);
    if(!el) return;
    var w = 640, h = opts.height || 220;
    var padL=52, padR=14, padT=16, padB=32;
    var innerW = w-padL-padR, innerH = h-padT-padB;
    var yFormat = opts.yFormat || function(v){return v.toFixed(0);};

    if(!categories.length){ el.innerHTML = '<div class="empty">Sem dados suficientes ainda.</div>'; return; }

    var allVals = [];
    series.forEach(function(s){ allVals = allVals.concat(s.values); });
    var yMax = Math.max.apply(null, allVals.concat([0]));
    if(yMax<=0) yMax = 1;
    yMax *= 1.18;

    function yScale(v){ return padT + innerH - (v/yMax*innerH); }

    var steps=4, gridLines="", gridLabels="";
    for(var i=0;i<=steps;i++){
      var yv = yMax*i/steps;
      var yy = yScale(yv);
      gridLines += '<line x1="'+padL+'" y1="'+yy.toFixed(1)+'" x2="'+(w-padR)+'" y2="'+yy.toFixed(1)+'" style="stroke:var(--border);stroke-width:1;"/>';
      gridLabels += '<text x="'+(padL-8)+'" y="'+(yy+4).toFixed(1)+'" text-anchor="end" font-size="10.5" style="fill:var(--text-muted);">'+esc(yFormat(yv))+'</text>';
    }

    var groupW = innerW/categories.length;
    var barGap = 3;
    var barW = Math.min(40, (groupW-6-barGap*(series.length-1))/series.length);
    if(barW<2) barW=2;
    var barsHtml="", labelsHtml="", catLabelsHtml="";
    categories.forEach(function(cat, ci){
      var groupX = padL + ci*groupW;
      var totalBarsW = barW*series.length + barGap*(series.length-1);
      var startX = groupX + (groupW-totalBarsW)/2;
      series.forEach(function(s, si){
        var v = s.values[ci]||0;
        var barX = startX + si*(barW+barGap);
        var barY = yScale(v);
        var barH = (padT+innerH) - barY;
        barsHtml += '<rect x="'+barX.toFixed(1)+'" y="'+barY.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+Math.max(0,barH).toFixed(1)+'" rx="4" style="fill:'+s.color+';" class="chart-bar" data-tip="'+esc((cat?cat+" — ":"")+s.label+": "+yFormat(v))+'"></rect>';
        if(v>0 && barW>=10){
          labelsHtml += '<text x="'+(barX+barW/2).toFixed(1)+'" y="'+(barY-6).toFixed(1)+'" text-anchor="middle" font-size="10" style="fill:var(--text-muted);">'+esc(yFormat(v))+'</text>';
        }
      });
      if(cat){
        catLabelsHtml += '<text x="'+(groupX+groupW/2).toFixed(1)+'" y="'+(h-10)+'" text-anchor="middle" font-size="10.5" style="fill:var(--text-muted);">'+esc(cat)+'</text>';
      }
    });

    var legendHtml = "";
    if(series.length>1){
      legendHtml = '<div class="chart-legend">' + series.map(function(s){
        return '<span class="item"><span class="sw" style="background:'+s.color+';"></span>'+esc(s.label)+'</span>';
      }).join("") + '</div>';
    }

    el.innerHTML =
      legendHtml +
      '<div style="position:relative;">' +
        '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:'+h+'px;display:block;">' +
          gridLines + barsHtml + gridLabels + labelsHtml + catLabelsHtml +
        '</svg>' +
        '<div id="'+containerId+'-tip" class="chart-tip" hidden></div>' +
      '</div>';

    var svg = el.querySelector("svg");
    var tip = document.getElementById(containerId+"-tip");
    el.querySelectorAll(".chart-bar").forEach(function(rect){
      rect.addEventListener("mousemove", function(ev){
        var rectBox = svg.getBoundingClientRect();
        tip.innerHTML = esc(rect.getAttribute("data-tip"));
        tip.hidden = false;
        tip.style.left = (ev.clientX - rectBox.left + 12)+"px";
        tip.style.top = (ev.clientY - rectBox.top - 10)+"px";
      });
      rect.addEventListener("mouseleave", function(){ tip.hidden = true; });
    });
  }

  function renderRelatorioMensalLancamentos(){
    var chartEl = document.getElementById("lanc-monthly-chart");
    var tableEl = document.getElementById("lanc-monthly-table");
    if(!chartEl) return;
    var byMonth = {};
    state.transacoes.forEach(function(t){
      if(!t.data) return;
      var key = t.data.slice(0,7);
      if(!byMonth[key]) byMonth[key] = {receita:0, despesa:0};
      if(t.tipo==="Receita") byMonth[key].receita += Number(t.valor)||0;
      else byMonth[key].despesa += Number(t.valor)||0;
    });
    var keys = Object.keys(byMonth).sort();
    if(!keys.length){
      chartEl.innerHTML = '<div class="empty">Sem lançamentos suficientes ainda.</div>';
      if(tableEl) tableEl.innerHTML = "";
      return;
    }
    var categories = keys.map(function(k){ var p=k.split("-"); return MESES_ABREV[Number(p[1])-1]+"/"+p[0].slice(2); });
    var receitaVals = keys.map(function(k){ return byMonth[k].receita; });
    var despesaVals = keys.map(function(k){ return byMonth[k].despesa; });
    renderBarChart("lanc-monthly-chart", categories, [
      { label:"Receita", color:"var(--accent)", values: receitaVals },
      { label:"Despesa", color:"var(--negative)", values: despesaVals }
    ], { yFormat: fmtBRL });

    if(tableEl){
      var rows = keys.map(function(k, i){
        var saldo = receitaVals[i]-despesaVals[i];
        return '<tr><td>'+esc(categories[i])+'</td><td class="num">'+fmtBRL(receitaVals[i])+'</td><td class="num">'+fmtBRL(despesaVals[i])+'</td><td class="num" style="color:'+(saldo>=0?"var(--positive)":"var(--negative)")+';">'+fmtBRL(saldo)+'</td></tr>';
      }).join("");
      tableEl.innerHTML = '<table><thead><tr><th>Mês</th><th>Receita</th><th>Despesa</th><th>Saldo</th></tr></thead><tbody>'+rows+'</tbody></table>';
    }
  }
